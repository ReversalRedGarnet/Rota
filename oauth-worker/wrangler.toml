name = "rotaract-honiara-decap-oauth"
main = "src/index.js"
compatibility_date = "2026-09-24"

# Secrets are set after deploying with `wrangler secret put <NAME>`, not
# written here — see README.md. Never commit real secrets to this file.
#
# Active (Cloudflare Access) flow:
#   CF_ACCESS_TEAM_DOMAIN  (required)
#   GITHUB_BOT_TOKEN       (required)
#
# Legacy (GitHub OAuth, unused but kept for rollback) flow:
#   GITHUB_OAUTH_ID        (required for legacy only)
#   GITHUB_OAUTH_SECRET    (required for legacy only)
#   GITHUB_REPO_PRIVATE    (optional, legacy only)
